<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e5f'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E%E4%BF%9D%3C/text%3E%3C/svg%3E">

<title>保障缺口試算</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#eef2f4;color:#20303a;font-size:16px;line-height:1.6;padding-bottom:40px}
header{background:linear-gradient(135deg,#1f4e5f,#2e7d8f);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 12px rgba(0,0,0,.18)}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px}
header p{margin:6px 0 0;font-size:12.5px;opacity:.85}
main{padding:16px 14px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,50,60,.08)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:700;color:#1f4e5f;
  padding-bottom:9px;border-bottom:2px solid #e3ecef;display:flex;align-items:center;gap:7px}
.card h2 span.n{background:#1f4e5f;color:#fff;width:20px;height:20px;border-radius:50%;
  font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0f4f6}
.row:last-child{border-bottom:none}
.row label{font-size:14.5px;color:#3c5158;flex:1 1 auto;min-width:0}
.row .hint{display:block;font-size:11.5px;color:#8fa3ac;font-weight:400;margin-top:1px}
input[type=number],input[type=text],select{
  width:112px;flex:0 0 auto;padding:9px 10px;font-size:16px;text-align:right;
  border:1.5px solid #d3dee3;border-radius:9px;background:#fafcfd;color:#1a2a32;
  font-family:inherit;transition:border-color .15s}
input[type=number]:focus,input[type=text]:focus,select:focus{
  outline:none;border-color:#2e7d8f;background:#fff;box-shadow:0 0 0 3px rgba(46,125,143,.12)}
select{width:132px;text-align:left}
.mode{display:flex;gap:9px;margin-bottom:14px}
.mode button{flex:1;padding:13px 8px;font-size:15px;font-weight:600;font-family:inherit;
  border:2px solid #cfdde2;background:#fff;color:#5c7480;border-radius:11px;cursor:pointer;transition:.15s}
.mode button.on{background:#1f4e5f;border-color:#1f4e5f;color:#fff;box-shadow:0 2px 8px rgba(31,78,95,.28)}
.btn{width:100%;padding:16px;font-size:17px;font-weight:700;font-family:inherit;color:#fff;
  background:linear-gradient(135deg,#1f4e5f,#2e7d8f);border:none;border-radius:12px;cursor:pointer;
  box-shadow:0 3px 12px rgba(31,78,95,.3);transition:.15s;letter-spacing:.5px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:#1f4e5f;border:2px solid #cfdde2;box-shadow:none;font-size:15px;padding:13px}
.person{border:1.5px solid #e3ecef;border-radius:11px;padding:4px 12px 8px;margin-bottom:12px;background:#fbfdfe}
.person h3{margin:8px 0 2px;font-size:13.5px;color:#2e7d8f;font-weight:700}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tot{background:#f7fafb;border-radius:10px;padding:11px;text-align:center;border:1px solid #e8f0f3}
.tot b{display:block;font-size:19px;color:#1f4e5f;letter-spacing:-.5px}
.tot small{font-size:11.5px;color:#7d949e}
.gapbox{border-radius:12px;padding:15px 16px;margin-bottom:12px;color:#fff}
.gapbox.hi{background:linear-gradient(135deg,#c0392b,#e05a4a)}
.gapbox.ok{background:linear-gradient(135deg,#1e7a56,#2f9e73)}
.gapbox .lbl{font-size:13px;opacity:.92;margin-bottom:3px}
.gapbox .num{font-size:31px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.gapbox .sub{font-size:12.5px;opacity:.9;margin-top:5px}
table.calc{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.calc td{padding:6px 2px;border-bottom:1px dashed #eef3f5;vertical-align:top}
table.calc td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;color:#20303a}
table.calc tr.sum td{border-top:2px solid #d3dee3;border-bottom:none;font-weight:700;color:#1f4e5f;padding-top:9px}
details{margin-top:10px}
details summary{cursor:pointer;font-size:13px;color:#2e7d8f;font-weight:600;padding:7px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";display:inline-block;transition:.15s}
details[open] summary::before{transform:rotate(90deg)}
.warn{background:#fff8e6;border-left:4px solid #e0a800;border-radius:8px;padding:11px 13px;
  font-size:12.5px;color:#6b5518;line-height:1.65;margin-bottom:14px}
.disc{font-size:11.5px;color:#8fa3ac;line-height:1.7;text-align:center;padding:10px 8px 0}
.hide{display:none!important}
.bar{height:9px;background:#e6eef1;border-radius:5px;overflow:hidden;margin:7px 0 3px;display:flex}
.bar i{display:block;height:100%}
.bar i.a{background:#2f9e73}
.bar i.b{background:#e05a4a}
.tests{font-size:13.5px;line-height:1.8;padding:11px 13px;border-radius:9px;background:#f2f7f9;margin-bottom:10px}
.tests b{color:#c0392b}
.tests .good{color:#1e7a56;font-weight:700}
.stamp{font-size:11px;color:#a9bcc4;text-align:center;margin-top:18px}
@media(max-width:360px){input[type=number],input[type=text]{width:96px}}
</style>
</head>
<body>
<header>
  <h1>保障缺口試算</h1>
  <p>家庭責任法 ＋ 雙十原則 ｜ 純本機計算，資料不外傳</p>
</header>

<main>
  <div class="mode">
    <button id="mSingle" class="on">單身</button>
    <button id="mCouple">夫妻</button>
  </div>

  <!-- 步驟1 -->
  <div class="card">
    <h2><span class="n">1</span>家庭責任</h2>
    <div class="row"><label>房貸餘額<span class="hint">還沒還完的房貸</span></label>
      <input type="number" id="mortgage" value="600" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    <div class="row"><label>其他負債<span class="hint">車貸、信貸、卡費</span></label>
      <input type="number" id="debt" value="40" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    <div class="row"><label>每月家庭生活費</label>
      <input type="number" id="living" value="4" min="0" step="0.5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    <div class="row"><label>生活費要照顧幾年<span class="hint">通常算到最小子女成年</span></label>
      <input type="number" id="years" value="20" min="1" max="50" step="1"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">年</span></div>
    <div class="row"><label>子女數</label>
      <input type="number" id="kids" value="2" min="0" max="10" step="1"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">人</span></div>
    <div class="row"><label>每名子女教育費<span class="hint">從現在到大學畢業</span></label>
      <input type="number" id="edu" value="200" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    <div class="row"><label>喪葬費</label>
      <input type="number" id="funeral" value="30" min="0" step="5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
  </div>

  <!-- 步驟2 -->
  <div class="card">
    <h2><span class="n">2</span>現有資源</h2>
    <div class="row"><label>家庭現有資產<span class="hint">存款、股票、可變現資產</span></label>
      <input type="number" id="assets" value="150" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>

    <div id="singlePerson">
      <div class="row"><label>年齡</label>
        <input type="number" id="age1" value="35" min="18" max="80" step="1"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">歲</span></div>
      <div class="row"><label>年收入</label>
        <input type="number" id="income1" value="80" min="0" step="5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
      <div class="row"><label>現有壽險保額<span class="hint">含團保、意外險</span></label>
        <input type="number" id="life1" value="300" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
      <div class="row"><label>現有醫療日額</label>
        <input type="number" id="med1" value="1000" min="0" step="500"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">元</span></div>
      <div class="row"><label>現有實支實付額度</label>
        <input type="number" id="reimb1" value="10" min="0" step="1"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
      <div class="row"><label>現有失能月扶助</label>
        <input type="number" id="dis1" value="0" min="0" step="0.5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    </div>

    <div id="couplePerson" class="hide">
      <div class="person">
        <h3>先生</h3>
        <div class="row"><label>年齡</label><input type="number" id="ageH" value="38" min="18" max="80"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">歲</span></div>
        <div class="row"><label>年收入</label><input type="number" id="incomeH" value="90" min="0" step="5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
        <div class="row"><label>現有壽險保額</label><input type="number" id="lifeH" value="300" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
        <div class="row"><label>工作到幾歲</label><input type="number" id="retireH" value="65" min="40" max="80"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">歲</span></div>
      </div>
      <div class="person">
        <h3>太太</h3>
        <div class="row"><label>年齡</label><input type="number" id="ageW" value="35" min="18" max="80"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">歲</span></div>
        <div class="row"><label>年收入<span class="hint">家管填 0</span></label><input type="number" id="incomeW" value="45" min="0" step="5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
        <div class="row"><label>現有壽險保額</label><input type="number" id="lifeW" value="100" min="0" step="10"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
        <div class="row"><label>工作到幾歲<span class="hint">家管填 65</span></label><input type="number" id="retireW" value="65" min="40" max="80"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">歲</span></div>
      </div>
    </div>

    <div class="row"><label>現有醫療日額</label>
      <input type="number" id="med" value="1000" min="0" step="500"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">元</span></div>
    <div class="row"><label>現有實支實付額度</label>
      <input type="number" id="reimb" value="10" min="0" step="1"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
    <div class="row"><label>現有失能月扶助</label>
      <input type="number" id="dis" value="0" min="0" step="0.5"><span style="font-size:13px;color:#8fa3ac;margin-left:-4px">萬</span></div>
  </div>

  <button class="btn" id="calc">開始試算</button>

  <div id="out" class="hide" style="margin-top:18px"></div>

  <p class="disc">
    本試算僅供參考，實際保障需求請與您的業務員討論。<br>
    不構成要保建議，不代表任何保險商品之推介。
  </p>
  <p class="stamp">資料僅在本機運算，不會上傳</p>
</main>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };
var V = function(id){ var n = parseFloat($(id).value); return isNaN(n) ? 0 : n; };

var mode = "single";
$("mSingle").onclick = function(){ setMode("single"); };
$("mCouple").onclick = function(){ setMode("couple"); };

function setMode(m){
  mode = m;
  $("mSingle").className = (m === "single") ? "on" : "";
  $("mCouple").className = (m === "couple") ? "on" : "";
  $("singlePerson").className = (m === "single") ? "" : "hide";
  $("couplePerson").className = (m === "couple") ? "" : "hide";
}

function fmt(n){ // 萬 → 顯示
  if (Math.abs(n) >= 10000) return (n/10000).toFixed(2) + " 億";
  return Math.round(n).toLocaleString("en-US") + " 萬";
}
function fmtMoney(n){ return Math.round(n).toLocaleString("en-US"); }

// 家庭總需求（不含保障扣除）
function totalNeed(){
  var mortgage = V("mortgage");
  var debt = V("debt");
  var living = V("living") * 12 * V("years");
  var edu = V("kids") * V("edu");
  var funeral = V("funeral");
  return {
    mortgage: mortgage,
    debt: debt,
    living: living,
    edu: edu,
    funeral: funeral,
    sum: mortgage + debt + living + edu + funeral
  };
}

function needTable(n, title){
  var h = '<details><summary>' + title + ' 算式</summary><table class="calc">';
  h += '<tr><td>房貸餘額</td><td>' + fmt(n.mortgage) + '</td></tr>';
  h += '<tr><td>其他負債</td><td>' + fmt(n.debt) + '</td></tr>';
  h += '<tr><td>生活費 ' + V("living") + '萬 × 12月 × ' + V("years") + '年</td><td>' + fmt(n.living) + '</td></tr>';
  h += '<tr><td>教育費 ' + V("kids") + '人 × ' + V("edu") + '萬</td><td>' + fmt(n.edu) + '</td></tr>';
  h += '<tr><td>喪葬費</td><td>' + fmt(n.funeral) + '</td></tr>';
  h += '<tr class="sum"><td>需求合計</td><td>' + fmt(n.sum) + '</td></tr>';
  h += '</table></details>';
  return h;
}

function gapBox(gap, label){
  var cls = gap > 0 ? "hi" : "ok";
  var txt = gap > 0 ? fmt(gap) : "無缺口";
  var sub = gap > 0 ? "這是萬一發生時，家裡會短少的金額" : "現有保障已足夠";
  return '<div class="gapbox ' + cls + '"><div class="lbl">' + label + '</div>' +
         '<div class="num">' + txt + '</div><div class="sub">' + sub + '</div></div>';
}

function calcSingle(){
  var n = totalNeed();
  var assets = V("assets");
  var life = V("life1");
  var income = V("income1");
  var age = V("age1");

  var gap = n.sum - assets - life;
  if (gap < 0) gap = 0;

  var doubleTen = income * 10;
  var premiumCap = income / 10;

  // 醫療
  var medGap = Math.max(0, 3000 - V("med1"));
  var reimbGap = Math.max(0, 30 - V("reimb1"));
  var disGap = Math.max(0, 3 - V("dis1"));

  var h = '';
  h += '<div class="card"><h2><span class="n">✓</span>試算結果</h2>';
  h += '<div class="totals"><div class="tot"><b>' + fmt(n.sum) + '</b><small>家庭責任需求</small></div>' +
       '<div class="tot"><b>' + fmt(assets + life) + '</b><small>現有資源</small></div></div>';
  h += gapBox(gap, "壽險缺口");
  h += needTable(n, "需求");
  h += '<details><summary>扣除項</summary><table class="calc">';
  h += '<tr><td>家庭現有資產</td><td>− ' + fmt(assets) + '</td></tr>';
  h += '<tr><td>現有壽險保額</td><td>− ' + fmt(life) + '</td></tr>';
  h += '</table></details>';
  h += '</div>';

  h += realityCheck(gap, income, premiumCap);

  h += '<div class="card"><h2><span class="n">＋</span>雙十原則驗算</h2>';
  h += '<div class="totals"><div class="tot"><b>' + fmt(doubleTen) + '</b><small>建議保額（年收×10）</small></div>' +
       '<div class="tot"><b>' + fmt(premiumCap) + '</b><small>年繳保費上限</small></div></div>';
  h += '<p style="font-size:12.5px;color:#7d949e;margin:8px 0 0">用兩個方法交叉檢查，避免單一算法偏差。</p>';
  h += '</div>';

  h += '<div class="card"><h2><span class="n">＋</span>醫療與失能缺口</h2>';
  h += '<table class="calc">';
  h += '<tr><td>住院日額（現 ' + fmtMoney(V("med1")) + ' 元 / 建議 3,000）</td><td>' + (medGap > 0 ? "缺 " + fmtMoney(medGap) + " 元/日" : "足夠") + '</td></tr>';
  h += '<tr><td>實支實付（現 ' + V("reimb1") + ' 萬 / 建議 30 萬）</td><td>' + (reimbGap > 0 ? "缺 " + reimbGap + " 萬" : "足夠") + '</td></tr>';
  h += '<tr><td>失能月扶助（現 ' + V("dis1") + ' 萬 / 建議 3 萬）</td><td>' + (disGap > 0 ? "缺 " + disGap + " 萬/月" : "足夠") + '</td></tr>';
  h += '</table></div>';

  return h;
}

function calcCouple(){
  var n = totalNeed();
  var assets = V("assets");

  var ageH = V("ageH"), ageW = V("ageW");
  var incH = V("incomeH"), incW = V("incomeW");
  var lifeH = V("lifeH"), lifeW = V("lifeW");
  var retH = V("retireH"), retW = V("retireW");

  var yrsH = Math.max(0, retH - ageH);
  var yrsW = Math.max(0, retW - ageW);
  var DISC = 0.02; // 折現率 2%

  // 情境A：先生走了 → 太太未來收入折現後可支應家庭
  var wifeIncomePV = pvAnnuity(incW, yrsW, DISC);
  var gapH = n.sum - assets - lifeH - wifeIncomePV;
  if (gapH < 0) gapH = 0;

  // 情境B：太太走了 → 先生未來收入折現後可支應家庭
  var husIncomePV = pvAnnuity(incH, yrsH, DISC);
  var gapW = n.sum - assets - lifeW - husIncomePV;
  if (gapW < 0) gapW = 0;

  // 單薪測試（單位：萬）
  var mortgageMonthly = V("mortgage") / 20 / 12; // 粗估 20 年攤還
  var livingMonthly = V("living");

  var afterH = incW / 12 - mortgageMonthly - livingMonthly;  // 先生走後
  var afterW = incH / 12 - mortgageMonthly - livingMonthly;  // 太太走後

  var h = '';
  h += '<div class="card"><h2><span class="n">✓</span>夫妻試算結果</h2>';
  h += '<div class="totals"><div class="tot"><b>' + fmt(n.sum) + '</b><small>家庭責任需求</small></div>' +
       '<div class="tot"><b>' + fmt(assets) + '</b><small>現有資產</small></div></div>';
  h += '<p style="font-size:12.5px;color:#7d949e;margin:6px 0 12px">兩個缺口不相加。分別代表「其中一方走了，家裡還缺多少」。</p>';

  h += '<div class="person" style="background:#fff"><h3>情境 A：先生走了</h3>';
  h += gapBox(gapH, "先生的壽險缺口");
  h += '<table class="calc">';
  h += '<tr><td>家庭需求</td><td>' + fmt(n.sum) + '</td></tr>';
  h += '<tr><td>太太未來收入折現（' + yrsof(yrsW) + '，2%）</td><td>− ' + fmt(wifeIncomePV) + '</td></tr>';
  h += '<tr><td>現有資產</td><td>− ' + fmt(assets) + '</td></tr>';
  h += '<tr><td>先生現有保額</td><td>− ' + fmt(lifeH) + '</td></tr>';
  h += '<tr class="sum"><td>缺口</td><td>' + fmt(gapH) + '</td></tr>';
  h += '</table></div>';

  h += '<div class="person" style="background:#fff"><h3>情境 B：太太走了</h3>';
  h += gapBox(gapW, "太太的壽險缺口");
  h += '<table class="calc">';
  h += '<tr><td>家庭需求</td><td>' + fmt(n.sum) + '</td></tr>';
  h += '<tr><td>先生未來收入折現（' + yrsof(yrsH) + '，2%）</td><td>− ' + fmt(husIncomePV) + '</td></tr>';
  h += '<tr><td>現有資產</td><td>− ' + fmt(assets) + '</td></tr>';
  h += '<tr><td>太太現有保額</td><td>− ' + fmt(lifeW) + '</td></tr>';
  h += '<tr class="sum"><td>缺口</td><td>' + fmt(gapW) + '</td></tr>';
  h += '</table></div>';

  h += needTable(n, "家庭總需求");
  h += '</div>';

  // 單薪測試
  h += '<div class="card"><h2><span class="n">!</span>單薪測試</h2>';
  h += '<p style="font-size:12.5px;color:#7d949e;margin:0 0 10px">其中一方走了，另一方的收入扣掉房貸與生活費，每月剩多少。</p>';
  h += '<div class="tests">';
  h += '<div>先生走後 → 太太每月 <b>' + (afterH < 0 ? "短少 " + fmtMoney(Math.abs(afterH) * 10000) + " 元" : '<span class="good">尚餘 ' + fmtMoney(afterH * 10000) + ' 元</span>') + '</div>';
  h += '<div>太太走後 → 先生每月 <b>' + (afterW < 0 ? "短少 " + fmtMoney(Math.abs(afterW) * 10000) + " 元" : '<span class="good">尚餘 ' + fmtMoney(afterW * 10000) + ' 元</span>') + '</div>';
  h += '</div>';
  h += '<p style="font-size:12px;color:#8fa3ac;margin:6px 0 0">房貸 ' + fmt(V("mortgage")) + ' 分 20 年，月付約 ' + fmtMoney(mortgageMonthly * 10000) + ' 元。</p>';
  h += '</div>';

  // 雙十
  h += '<div class="card"><h2><span class="n">＋</span>雙十原則驗算</h2>';
  h += '<table class="calc">';
  h += '<tr><td>先生 建議保額（年收×10）</td><td>' + fmt(incH * 10) + '</td></tr>';
  h += '<tr><td>太太 建議保額（年收×10）</td><td>' + fmt(incW * 10) + '</td></tr>';
  h += '<tr><td>家庭年繳保費上限</td><td>' + fmt((incH + incW) / 10) + '</td></tr>';
  h += '</table></div>';

  // 現實檢查：以較大缺口對照該人的年收入
  var bigGap = Math.max(gapH, gapW);
  var isH = gapH >= gapW;
  var who = isH ? "先生" : "太太";
  var ownIncome = isH ? incH : incW;
  h += realityCheck(bigGap, ownIncome, (incH + incW) / 10)
       .replace("現實檢查", "現實檢查（以" + who + "的缺口為準）")
       .replace("缺口 ÷ 年收入", who + "缺口 ÷ " + who + "年收入");

  return h;
}

function yrsof(y){ return y + " 年"; }

// 年金現值：未來每年收入，以折現率 d 折回今天
function pvAnnuity(annual, years, d){
  if (years <= 0) return 0;
  if (annual <= 0) return 0;
  if (d <= 0) return annual * years;
  return annual * (1 - Math.pow(1 + d, -years)) / d;
}

// 現實檢查：缺口對照年收入，判斷買不買得到
function realityCheck(gap, annualIncome, premiumCap){
  if (annualIncome <= 0) return '';
  var ratio = gap / annualIncome;
  var h = '<div class="card"><h2><span class="n">!</span>現實檢查</h2>';
  h += '<table class="calc">';
  h += '<tr><td>缺口 ÷ 年收入</td><td>' + ratio.toFixed(1) + ' 倍</td></tr>';
  h += '<tr><td>年繳保費上限（年收 10%）</td><td>' + fmt(premiumCap) + '</td></tr>';
  h += '</table>';

  if (ratio > 15){
    h += '<div class="warn" style="margin-top:11px">' +
      '<b>這個缺口在實務上買不到足額。</b><br>' +
      '缺口是年收入的 ' + ratio.toFixed(1) + ' 倍，但保費預算只有年收 10%，' +
      '全買足會壓垮家庭現金流。<br><br>' +
      '<b>實務優先順序：</b><br>' +
      '① 先補定期壽險（保費低、保額高）<br>' +
      '② 再補失能險（發生機率比身故高）<br>' +
      '③ 醫療實支實付<br>' +
      '④ 最後才考慮終身型或儲蓄型' +
      '</div>';
  } else if (ratio > 8){
    h += '<div class="warn" style="margin-top:11px">缺口是年收入 ' + ratio.toFixed(1) + ' 倍，' +
      '建議以定期壽險為主， gradually 補足。</div>';
  } else {
    h += '<p style="font-size:12.5px;color:#1e7a56;margin-top:10px;font-weight:600">缺口在合理範圍，可用一般保費預算補足。</p>';
  }
  h += '</div>';
  return h;
}

$("calc").onclick = function(){
  var html = (mode === "single") ? calcSingle() : calcCouple();
  var out = $("out");
  out.innerHTML = html;
  out.className = "";
  out.scrollIntoView({ behavior: "smooth", block: "start" });
};

// 預設算一次
$("calc").click();

})();
</script>
